services:
  postgres:
    image: postgres:16-alpine
    container_name: istighfar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: istighfar
      POSTGRES_PASSWORD: istighfar
      POSTGRES_DB: istighfar
    ports:
      - "5432:5432"
    volumes:
      - istighfar_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istighfar -d istighfar"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  istighfar_pg:
